[package]
name = "firebreak-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cells = { version = "0.1.0", path = "../../flame-lib/cells" }
curve25519-dalek = { version = "4", features = ["serde", "legacy_compatibility", "rand_core"] }
flamechain = { version = "0.1.0", path = "../../flame-lib/flamechain" }
flamed-rpc = { version = "0.1.0", path = "../../flame-lib/flamed-rpc" }
flamekd = { version = "0.1.0", path = "../../flame-lib/flamekd" }
flamepayments = { version = "0.1.0", path = "../../flame-lib/flamepayments" }
flamevm = { version = "0.1.0", path = "../../flame-lib/flamevm" }
hex = "0.4"
jsonrpsee = { version = "0.26", features = ["server"], optional = true }
merlin = "3"
musig = { version = "0.1.0", path = "../../flame-lib/musig" }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1.53.1", features = ["time"] }

[dependencies.flamed]
version = "0.1.0"
path = "../../flame-lib/flamed"
features = ["devnet"]
optional = true

[features]
# An in-process Flame devnet, for tests and local tooling.
devnet = ["dep:flamed", "dep:jsonrpsee", "dep:tempfile"]

[dev-dependencies]
firebreak-core = { path = ".", features = ["devnet"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
