[package]
name = "firebreak-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
firebreak-core = { version = "0.1.0", path = "../firebreak-core" }
flamekd = { version = "0.1.0", path = "../../flame-lib/flamekd" }
flamevm = { version = "0.1.0", path = "../../flame-lib/flamevm" }
hex = "0.4.3"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[dev-dependencies]
firebreak-core = { path = "../firebreak-core", features = ["devnet"] }
flamepayments = { path = "../../flame-lib/flamepayments" }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
tempfile = "3.27.0"
